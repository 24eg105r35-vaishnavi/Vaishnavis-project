# MySQL Configuration Profile
spring.datasource.url=jdbc:mysql://localhost:3306/student_achievement_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.upload.dir=./file-vault
app.portal.institution=Anurag University
app.portal.domain=@anurag.edu.in
