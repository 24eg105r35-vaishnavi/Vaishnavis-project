<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body style="background: var(--slate-100);">

<header th:replace="~{fragments/layout :: header}"></header>

<main class="main-content" style="display: flex; align-items: center; justify-content: center; min-height: 75vh; padding: 2rem 1rem;">
    <div style="width: 100%; max-width: 440px;">

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-xl);">
            <div style="text-align: center; margin-bottom: 1.75rem;">
                <div style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary-600), var(--primary-800)); color: white; border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.75rem; box-shadow: var(--shadow-glow);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--slate-900);">Institutional Sign In</h1>
                <p style="font-size: 0.88rem; color: var(--slate-500); margin-top: 0.25rem;">
                    Sign in with your Anurag University credentials
                </p>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label class="form-label" for="email">Institutional E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@anurag.edu.in" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
                    <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--slate-600);">
                        <input type="checkbox" name="remember-me"> Remember session
                    </label>
                    <span style="color: var(--slate-400);">Protected by BCrypt</span>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
                    Sign In to Portal
                </button>
            </form>

            <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--slate-100); text-align: center; font-size: 0.88rem; color: var(--slate-600);">
                New undergraduate student?
                <a th:href="@{/register}" style="font-weight: 700; color: var(--primary-600);">Register an Account</a>
            </div>

        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
